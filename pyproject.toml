[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graft-worker"
version = "0.1.0"
description = "GPU Resource-Aware Fault-tolerant Training workers"
requires-python = ">=3.10"
dependencies = ["torch==2.5.0", "numpy==2.1.3"]

[project.optional-dependencies]
dev = ["ruff==0.9.10"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
line-length = 110
target-version = "py310"
